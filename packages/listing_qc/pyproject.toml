[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-qc"
version = "0.1.0"
description = "Shared listing QC helpers for AquaVerve / GrovePop / AquaRides"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["listing_qc*"]
