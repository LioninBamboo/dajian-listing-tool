<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product History - AquaVerve Collection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
        }

        .card-header h3 {
            font-size: 1.1em;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-header .sku {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 8px;
        }

        .status-PENDING {
            background: #ffd93d;
            color: #333;
        }

        .status-PROCESSING {
            background: #6bcf7f;
            color: white;
        }

        .status-READY {
            background: #4facfe;
            color: white;
        }

        .status-PUBLISHED {
            background: #43e97b;
            color: white;
        }

        .status-ERROR {
            background: #fa709a;
            color: white;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .image-grid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .image-grid img:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .video-preview {
            padding: 10px;
            background: #f9f9f9;
        }

        .video-preview video {
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .price-breakdown {
            padding: 15px;
            background: #f0f4f8;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .price-row.total {
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
            border-bottom: none;
            margin-top: 10px;
        }

        .actions {
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-publish {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-publish:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-publish:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-view {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-view:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 100px 20px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐟 Product Collection History</h1>
        <div id="productGrid" class="product-grid">
            <div class="loading">Loading products...</div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                const data = await response.json();

                if (data.status === 'success' && data.products.length > 0) {
                    renderProducts(data.products);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('Failed to load products:', error);
                document.getElementById('productGrid').innerHTML =
                    '<div class="empty-state"><h2>Failed to load products</h2></div>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="card-header">
                        <h3>${product.title || 'Untitled Product'}</h3>
                        <div class="sku">SKU: ${product.sku}</div>
                        <span class="status-badge status-${product.status}">${product.status}</span>
                    </div>
                    
                    ${product.images && product.images.length > 0 ? `
                        <div class="image-grid">
                            ${product.images.slice(0, 12).map(img =>
                `<img src="${img}" alt="Product" onclick="window.open('${img}', '_blank')">`
            ).join('')}
                        </div>
                    ` : ''}
                    
                    ${product.videos && product.videos.length > 0 ? `
                        <div class="video-preview">
                            <video controls>
                                <source src="${product.videos[0]}" type="video/mp4">
                            </video>
                        </div>
                    ` : ''}
                    
                    <div class="price-breakdown">
                        <div class="price-row">
                            <span>大建成本:</span>
                            <span>$${product.price?.toFixed(2) || '0.00'}</span>
                        </div>
                        <div class="price-row">
                            <span>运费:</span>
                            <span>$${product.shipping?.toFixed(2) || '0.00'}</span>
                        </div>
                        ${product.cost_breakdown ? `
                            <div class="price-row">
                                <span>保险费:</span>
                                <span>$${product.cost_breakdown.insurance_fee?.toFixed(2) || '0.00'}</span>
                            </div>
                            <div class="price-row">
                                <span>支付手续费:</span>
                                <span>$${product.cost_breakdown.payment_fee?.toFixed(2) || '0.00'}</span>
                            </div>
                            <div class="price-row total">
                                <span>建议售价 (15%利润):</span>
                                <span>$${product.suggested_price?.toFixed(2) || 'Calculating...'}</span>
                            </div>
                        ` : `
                            <div class="price-row total">
                                <span>总成本:</span>
                                <span>$${((product.price || 0) + (product.shipping || 0)).toFixed(2)}</span>
                            </div>
                        `}
                    </div>
                    
                    <div class="actions">
                        <button class="btn btn-view" onclick="window.open('${product.url}', '_blank')">
                            查看原页
                        </button>
                        <button 
                            class="btn btn-publish" 
                            ${product.status !== 'READY' ? 'disabled' : ''}
                            onclick="publishProduct('${product.sku}')"
                        >
                            ${product.status === 'PUBLISHED' ? '✓ 已上架' :
                    product.status === 'READY' ? 'Confirm & List to eBay' :
                        product.status === 'PROCESSING' ? '分析中...' : '等待处理'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function showEmptyState() {
            document.getElementById('productGrid').innerHTML = `
                <div class="empty-state">
                    <h2>No products collected yet</h2>
                    <p>Start collecting products from Dajian Cloud Warehouse!</p>
                </div>
            `;
        }

        async function publishProduct(sku) {
            if (!confirm(`确认上架产品 ${sku} 到 eBay?`)) return;

            try {
                const response = await fetch(`/api/publish/${sku}`, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'success') {
                    alert(`✅ 产品已成功上架!\nListing ID: ${data.listing_id}`);
                    loadProducts(); // Reload to update status
                } else {
                    alert(`❌ 上架失败: ${data.message}`);
                }
            } catch (error) {
                alert(`❌ 上架失败: ${error.message}`);
            }
        }

        // Auto-refresh every 10 seconds to see analysis progress
        setInterval(loadProducts, 10000);

        // Initial load
        loadProducts();
    </script>
</body>

</html>
