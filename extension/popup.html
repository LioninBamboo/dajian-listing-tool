<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 300px;
            padding: 15px;
            background: #f8f9fa;
        }
        h2 { margin-top: 0; color: #333; font-size: 18px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 12px; }
        input { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0060df;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0050c0; }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 4px;
            border: 1px solid #bbdefb;
            text-align: center;
        }
        .price-display {
            font-size: 24px;
            color: #0d47a1;
            font-weight: bold;
        }
        .settings-link {
            text-align: right;
            font-size: 11px;
            margin-top: 10px;
            color: #999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>💰 AquaVerve Calculator</h2>
    
    <div class="input-group">
        <label>Cost Cost (USD)</label>
        <input type="number" id="cost" placeholder="e.g. 50.00" step="0.01">
    </div>

    <div class="input-group">
        <label>Shipping Cost (USD)</label>
        <input type="number" id="shipping" placeholder="e.g. 15.00" step="0.01">
    </div>

    <div class="input-group">
        <label>Target Margin (%)</label>
        <input type="number" id="margin" placeholder="e.g. 30" value="30">
    </div>

    <button id="calcBtn">Calculate Price</button>

    <div class="result" id="resultArea" style="display:none;">
        <div>Recommended Price:</div>
        <div class="price-display" id="finalPrice">$0.00</div>
        <div style="font-size: 11px; margin-top:5px; color:#666;">
            (eBay Fees est. 13%)
        </div>
    </div>
    
    <div id="status" style="margin-top:10px; font-size:12px; color:green; text-align:center;"></div>

    <script src="popup.js"></script>
</body>
</html>
